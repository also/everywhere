[project]
name = "everywhere-streets"
version = "0.1.0"
description = "Figure out which streets have been ridden"
authors = [
    { name = "Ryan Berdeen", email = "ryan@ryanberdeen.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.5",
    "osmium>=4.3.2",
    "pyproj>=3.8.0",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
]

[project.scripts]
streets = "everywhere_streets:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"
